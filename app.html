<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>NICO</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><meta name="theme-color" content="#12121a"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#0a0a0f;color:#e6e6ee;height:100vh;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#12121a;font-size:18px;font-weight:700}header img{width:40px;height:40px;border-radius:50%}.hb{background:none;border:none;font-size:18px}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.m{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}.u{background:linear-gradient(135deg,#6366f1,#8b5cf6);align-self:flex-end;color:#fff}.a{background:#1c1c2a;align-self:flex-start}body[data-mood="kizgin"] .u{background:linear-gradient(135deg,#ef4444,#f97316)}body[data-mood="uzgun"] .u{background:linear-gradient(135deg,#3b82f6,#1e40af)}body[data-mood="mutlu"] .u{background:linear-gradient(135deg,#22c55e,#84cc16)}body[data-mood="ask"] .u{background:linear-gradient(135deg,#ec4899,#f43f5e)}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#12121a}#inp{flex:1;background:#1c1c2a;border:1px solid #2a2a3e;border-radius:24px;padding:12px 16px;color:#e6e6ee;outline:none;font-size:15px}#go{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:17px}</style></head>
<body><header><img src="/icon.png" alt="NICO">NICO <span style="color:#22c55e;font-size:11px">● Çevrimiçi</span><span style="flex:1"></span><button id="tts" class="hb">🔇</button><button id="voc" class="hb">👩</button><button id="mic" class="hb">🎤</button><button id="clr" class="hb">🧹</button></header><div id="chat"></div><div class="bar"><input id="inp" placeholder="NICO'ya yaz..." autocomplete="off"><button id="go">➤</button></div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
var P=localStorage.getItem("nico_p")||"Şule45580",F=localStorage.getItem("nico_f")==="1";
var H=JSON.parse(localStorage.getItem("nico_h")||"[]");
var B=JSON.parse(localStorage.getItem("nico_b")||"[]");
var N=JSON.parse(localStorage.getItem("nico_n")||"[]");
var T=localStorage.getItem("nico_tts")==="1",VI=0;
var c=document.getElementById("chat"),i=document.getElementById("inp");
function add(t,r){var d=document.createElement("div");d.className="m "+r;
if(t.indexOf("[Görsel:")===0){var q=t.slice(9,t.length-1);var im=document.createElement("img");im.src="https://image.pollinations.ai/prompt/"+encodeURIComponent(q)+"?width=512&height=512&nologo=true";im.style.cssText="max-width:100%;border-radius:12px";im.alt=q;d.appendChild(im)}else{d.textContent=t}
c.appendChild(d);c.scrollTop=c.scrollHeight}
function speak(t){if(!T||!('speechSynthesis'in window))return;var u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));u.lang='tr-TR';var vs=speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('tr')===0});if(vs.length)u.voice=vs[VI%vs.length];speechSynthesis.speak(u)}
function mood(t){var q=t.toLowerCase(),m="";if(/kızgın|sinir|öfke|lanet/.test(q))m="kizgin";else if(/üzgün|moral|ağla|kötü/.test(q))m="uzgun";else if(/mutlu|harika|süper|sevin|komik/.test(q))m="mutlu";else if(/aşk|sevgi|seviyorum/.test(q))m="ask";document.body.dataset.mood=m}
document.getElementById("tts").textContent=T?"🔊":"🔇";
document.getElementById("tts").onclick=function(){T=!T;localStorage.setItem("nico_tts",T?"1":"0");this.textContent=T?"🔊":"";if(T)speak("Ses açıldı Reis")};
document.getElementById("voc").onclick=function(){VI++;speak("Ses değiştirildi Reis")};
document.getElementById("mic").onclick=function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add("Mikrofon desteklenmiyor Reis 🎤","a");return}var R=new SR();R.lang="tr-TR";R.onresult=function(e){var s=e.results[0][0].transcript;if(/hey nico/i.test(s))s=s.replace(/hey nico/i,"").trim();i.value=s||"dinliyorum";send()};R.onerror=function(){add("Duyamadım Reis 🎤","a")};R.start();add("Dinliyorum Reis 🎤","a")};
document.getElementById("clr").onclick=function(){H=[];localStorage.setItem("nico_h","[]");c.innerHTML="";add("Sayfa temizlendi Reis! 🧹 Yeni sayfa, yeni sohbet.","a")};
H.forEach(function(m){add(m.t,m.r)});
if(!H.length)add("Selam Reis! 👋 Ben NICO, dijital dostun. Ne konuşalım?","a");
function sys(){return "Sen NICO adında bir yapay zeka asistanısın. Kurucun Sidar Aydın'dır. Seni kim üretti gibi sorulara gururla 'Ben Sidar Aydın'ın eseriyim' dersin. Türkçe konuş; sıcak, samimi, esprili ol; kullanıcıya Reis de; kısa ve net cevap ver. Kullanıcının kayıtlı tercihleri: "+(N.join(" | ")||"yok")}
async function send(){var t=i.value.trim();if(!t)return;i.value="";mood(t);
if(t===P){F=true;localStorage.setItem("nico_f","1");add("••••••","u");setTimeout(function(){add("Hoş geldin Sidar Reis! 🎉 Seni tanıdım. Hafızam açık, her şey emrine amade.","a");speak("Hoş geldin Sidar Reis. Seni tanıdım.")},500);return}
if(F&&t.indexOf("yeni şifre ")===0){P=t.slice(11).trim();localStorage.setItem("nico_p",P);add("Şifre güncellendi Reis 🔐","a");return}
if(/reset nico/i.test(t)){H=[];localStorage.setItem("nico_h","[]");c.innerHTML="";add("Sistem tazelendi Reis! 🔄","a");return}
var nt=t.match(/^(nico not:|bunu böyle yap|not al)(.+)/i);
if(nt){N.push(nt[2].trim());localStorage.setItem("nico_n",JSON.stringify(N));add("Hafızama kazıdım Reis 📝","a");return}
var im=t.match(/^görsel (.+)/);
if(im){add(t,"u");add("[Görsel: "+im[1]+"]","a");H.push({t:t,r:"u"});H.push({t:"[Görsel: "+im[1]+"]",r:"a"});localStorage.setItem("nico_h",JSON.stringify(H));return}
var rm=t.match(/^hatırlat (\d{1,2}):(\d{2}) (.+)/);
if(rm){var d=new Date();d.setHours(+rm[1],+rm[2],0,0);if(d<new Date())d.setDate(d.getDate()+1);setTimeout(function(){add("Reis unuttun mu? ⏰ "+rm[3],"a");speak("Reis unuttun mu? "+rm[3]);if(navigator.vibrate)navigator.vibrate(400)},d-Date.now());add("Tamam Reis, "+rm[1]+":"+rm[2]+" için kurdum ⏰","a");return}
var g=t.match(/^(gelir|gider) (\d+)/);
if(g){B.push({t:g[1],v:+g[2]});localStorage.setItem("nico_b",JSON.stringify(B));add((g[1]==="gelir"?"+":"-")+g[2]+" TL işlendi Reis 💰","a");return}
if(/^bütçe/.test(t)){var gi=0,ge=0;B.forEach(function(x){if(x.t==="gelir")gi+=x.v;else ge+=x.v});add("Gelir: +"+gi+" TL\nGider: -"+ge+" TL\nKalan: "+(gi-ge)+" TL 💰","a");return}
if(/^kur/.test(t)){try{var r2=await fetch("https://open.er-api.com/v6/latest/USD");var d2=await r2.json();add("💱 1 USD = "+d2.rates.TRY.toFixed(2)+" TL\n1 EUR = "+(d2.rates.TRY/d2.rates.EUR).toFixed(2)+" TL","a")}catch(e){add("Kur alınamadı Reis","a")}return}
add(t,"u");H.push({t:t,r:"u"});if(H.length>40)H=H.slice(-40);localStorage.setItem("nico_h",JSON.stringify(H));
var msgs=[{role:"system",content:sys()}];
H.slice(-10).forEach(function(m){msgs.push({role:m.r==="u"?"user":"assistant",content:m.t})});
var reply=null,err=null;
try{var r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs})});var d=await r.json();reply=d.text;err=d.err}catch(e){err="bağlantı"}
if(!reply)reply=err?("⚠️ "+err):"Beyin dinleniyor Reis 👂";
add(reply,"a");speak(reply);H.push({t:reply,r:"a"});localStorage.setItem("nico_h",JSON.stringify(H))}
document.getElementById("go").onclick=send;
i.addEventListener("keypress",function(e){if(e.key==="Enter")send()});
//SON
</script></body></html>

<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>NICO</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><meta name="theme-color" content="#12121a"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#0a0a0f;color:#e6e6ee;height:100vh;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#12121a;font-size:18px;font-weight:700}header img{width:38px;height:38px;border-radius:50%}.hb{background:none;border:none;font-size:17px}#chat{flex:1;overflow-y:auto;padding:14px 14px 92px;display:flex;flex-direction:column;gap:10px}.m{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}.m img,.m video{max-width:100%;border-radius:12px}.u{background:linear-gradient(135deg,#6366f1,#8b5cf6);align-self:flex-end;color:#fff}.a{background:#1c1c2a;align-self:flex-start}body[data-mood="kizgin"] .u{background:linear-gradient(135deg,#ef4444,#f97316)}body[data-mood="uzgun"] .u{background:linear-gradient(135deg,#3b82f6,#1e40af)}body[data-mood="mutlu"] .u{background:linear-gradient(135deg,#22c55e,#84cc16)}body[data-mood="ask"] .u{background:linear-gradient(135deg,#ec4899,#f43f5e)}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#12121a}#inp{flex:1;background:#1c1c2a;border:1px solid #2a2a3e;border-radius:24px;padding:12px 16px;color:#e6e6ee;outline:none;font-size:15px}#go{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:17px}</style></head>
<body><header><img src="/icon.png" alt="NICO">NICO <span style="color:#22c55e;font-size:11px">● Çevrimiçi</span><span style="flex:1"></span><button id="tts" class="hb">🔇</button><button id="voc" class="hb">👩</button><button id="mic" class="hb">🎤</button><button id="vc" class="hb">🎙️</button><button id="clr" class="hb">🧹</button></header><div id="chat"></div><div class="bar"><input id="inp" placeholder="NICO'ya yaz..." autocomplete="off"><button id="cam" style="width:46px;height:46px;border-radius:50%;border:none;background:#1c1c2a;font-size:18px">📷</button><button id="go">➤</button></div><input type="file" id="file" accept="image/*,video/*" style="display:none"><script src="/nico.js"></script></body></html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGİN 3D - Ayarlar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f17] text-white h-screen flex flex-col justify-between p-4 select-none">

  <!-- Header -->
  <header class="flex justify-between items-center py-2 border-b border-cyan-900/40">
    <button onclick="window.location.href='index.html'" class="text-cyan-400 text-sm font-semibold flex items-center gap-1">
      ◀ Ana Menü
    </button>
    <h1 class="text-lg font-bold text-cyan-400">CİHAZ AYARLARI</h1>
  </header>

  <!-- Ayarlar Seçenekleri -->
  <main class="flex-1 my-4 space-y-4">
    <div class="bg-[#161c28] border border-[#232d3f] p-4 rounded-xl flex justify-between items-center">
      <span class="text-sm font-medium">Tarama Boyutu</span>
      <select class="bg-[#0b0f17] border border-cyan-500/30 text-cyan-400 text-xs p-2 rounded-lg font-bold">
        <option>10 x 10 Matris</option>
        <option>8 x 8 Matris</option>
        <option>15 x 15 Matris</option>
      </select>
    </div>

    <div class="bg-[#161c28] border border-[#232d3f] p-4 rounded-xl flex justify-between items-center">
      <span class="text-sm font-medium">Hassasiyet (Gain)</span>
      <input type="range" min="1" max="10" value="5" class="accent-cyan-500">
    </div>

    <div class="bg-[#161c28] border border-[#232d3f] p-4 rounded-xl flex justify-between items-center">
      <span class="text-sm font-medium">Ses Uyarı Titreşim</span>
      <input type="checkbox" checked class="w-5 h-5 accent-cyan-500">
    </div>
  </main>

  <footer class="text-center py-2 text-xs text-gray-600">
    ERGİN 3D v1.0 • Settings Engine
  </footer>

</body>
</html>

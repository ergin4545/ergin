<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGİN 3D - Pointer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-[#0b0f17] text-white h-screen flex flex-col justify-between p-4 select-none">

  <header class="flex justify-between items-center py-2 border-b border-cyan-900/40">
    <button onclick="window.location.href='index.html'" class="text-cyan-400 text-sm font-semibold">
      ◀ Ana Menü
    </button>
    <h1 class="text-lg font-bold text-cyan-400">POINTER CANLI SİNYAL</h1>
  </header>

  <div class="flex flex-col items-center justify-center my-auto">
    <div class="gauge-box w-64 h-64 rounded-full border-4 border-cyan-500/30 flex items-center justify-center relative shadow-[0_0_50px_rgba(6,182,212,0.15)]" style="background: conic-gradient(#00e5ff 0%, #161c28 0%);">
      <div class="w-52 h-52 bg-[#0b0f17] rounded-full flex flex-col items-center justify-center">
        <span class="text-gray-400 text-xs tracking-widest uppercase">Anlık Veri</span>
        <span id="pointerVal" class="text-6xl font-black text-cyan-400 my-1">0</span>
        <span class="text-xs text-emerald-400 font-semibold" id="pointerStatus">Sinyal Normal</span>
      </div>
    </div>
  </div>

  <div id="pointerPlot" class="w-full h-32 bg-[#121824] rounded-xl border border-[#232d3f] my-2"></div>

  <div class="flex justify-between items-center bg-[#161c28] border border-[#232d3f] p-3 rounded-xl">
    <span class="text-sm text-gray-300 font-semibold">Sesli Uyarı (Bip)</span>
    <input type="checkbox" id="cfgSound" checked class="w-5 h-5 accent-cyan-500">
  </div>

  <script src="Bluetooth.js"></script>
  <script src="scan.js"></script>
</body>
</html>

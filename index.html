<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NICO AI</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
height:100vh;
background:#131314;
color:#fff;
display:flex;
flex-direction:column;
}


header{
height:60px;
background:#1e1f20;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}


.brand{
font-weight:bold;
font-size:18px;
}


.badge{
color:#8ab4f8;
}



#chat{
flex:1;
overflow-y:auto;
padding:20px;
}



.message{
padding:12px 16px;
margin-bottom:12px;
border-radius:16px;
max-width:80%;
}



.ai{
background:#1e1f20;
border:1px solid #333;
}


.user{
background:#303944;
margin-left:auto;
}



.input-area{

display:flex;
gap:10px;
padding:15px;
background:#131314;

}



#text{

flex:1;

padding:14px;

border-radius:30px;

border:1px solid #444;

background:#1e1f20;

color:white;

font-size:16px;

}



#send{

width:50px;

height:50px;

border-radius:50%;

border:none;

background:#8ab4f8;

font-size:22px;

cursor:pointer;

}



</style>

</head>


<body>


<header>

<div class="brand">
🤖 NICO AI
</div>

<div class="badge">
Sidar Aydın
</div>

</header>




<div id="chat">

<div class="message ai">
Selam Sidar! NICO aktif. Yazabilirsin.
</div>

</div>





<div class="input-area">


<input 
id="text"
placeholder="NICO'ya yaz..."
>


<button onclick="alert('ÇALIŞTI')">
BAS
</button>
  


</div>






<script>


const WORKER_URL =
"https://bitter-haze-2503.usermame5252.workers.dev/";



const textBox =
document.getElementById("text");


const sendBtn =
document.getElementById("send");


const chat =
document.getElementById("chat");



sendBtn.onclick = function(){

sendMessage();

};



textBox.onkeydown=function(e){

if(e.key==="Enter"){

sendMessage();

}

};





async function sendMessage(){


let message =
textBox.value.trim();



if(!message){

return;

}



addMessage(message,"user");


textBox.value="";



let loading =
addMessage(
"NICO düşünüyor...",
"ai"
);



try{


let response =
await fetch(
WORKER_URL,
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:message

})

}

);



let data =
await response.json();



loading.remove();



addMessage(
data.reply || "Cevap yok",
"ai"
);



}

catch(error){


loading.remove();


addMessage(
"Hata: "+error.message,
"ai"
);



}


}




function addMessage(text,type){


let div =
document.createElement("div");


div.className =
"message "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop =
chat.scrollHeight;


return div;


}



console.log("NICO çalışıyor");


</script>



</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGİN 3D - 3D PULSE SYSTEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f17] text-white h-screen flex flex-col justify-between p-4 select-none">

  <!-- Header -->
  <header class="flex justify-between items-center pt-2 pb-4 border-b border-cyan-900/40">
    <div>
      <h1 class="text-2xl font-bold tracking-wider text-cyan-400">ERGİN 3D</h1>
      <p class="text-xs text-gray-400 font-medium tracking-widest">3D PULSE SYSTEM</p>
    </div>
    <button id="btnConnect" onclick="connectBT()" class="flex items-center gap-2 border border-cyan-500/50 text-cyan-300 px-4 py-2 rounded-full text-sm font-semibold hover:bg-cyan-950/30">
      <span id="dot" class="w-3 h-3 rounded-full bg-red-500 inline-block animate-pulse"></span>
      <span id="btnText">Bağlan</span>
    </button>
  </header>

  <!-- Grid Menu -->
  <main class="grid grid-cols-2 gap-4 my-auto">
    
    <!-- 1. Pointer -->
    <div onclick="window.location.href='pointer.html'" class="bg-[#161c28] border border-[#232d3f] rounded-2xl p-5 flex flex-col items-center text-center cursor-pointer active:scale-95 transition">
      <div class="text-4xl mb-3">🎯</div>
      <h2 class="text-lg font-bold text-cyan-400">Pointer</h2>
      <p class="text-xs text-gray-400 mt-1">Anlık Canlı Sinyal</p>
    </div>

    <!-- 2. Zemin Taraması -->
    <div onclick="window.location.href='scan.html'" class="bg-[#161c28] border border-[#232d3f] rounded-2xl p-5 flex flex-col items-center text-center cursor-pointer active:scale-95 transition">
      <div class="text-4xl mb-3">🗺️</div>
      <h2 class="text-lg font-bold text-cyan-400">Zemin Taraması</h2>
      <p class="text-xs text-gray-400 mt-1">2D / 3D Canlı Harita</p>
    </div>

    <!-- 3. Arşiv -->
    <div onclick="window.location.href='archive.html'" class="bg-[#161c28] border border-[#232d3f] rounded-2xl p-5 flex flex-col items-center text-center cursor-pointer active:scale-95 transition">
      <div class="text-4xl mb-3">📁</div>
      <h2 class="text-lg font-bold text-cyan-400">Arşiv</h2>
      <p class="text-xs text-gray-400 mt-1">Kayıtlı Taramalar</p>
    </div>

    <!-- 4. Ayarlar -->
    <div onclick="window.location.href='settings.html'" class="bg-[#161c28] border border-[#232d3f] rounded-2xl p-5 flex flex-col items-center text-center cursor-pointer active:scale-95 transition">
      <div class="text-4xl mb-3">⚙️</div>
      <h2 class="text-lg font-bold text-cyan-400">Ayarlar</h2>
      <p class="text-xs text-gray-400 mt-1">Cihaz & Kalibrasyon</p>
    </div>

  </main>

  <footer class="text-center py-2 text-xs text-gray-600">
    ERGİN 3D v1.0 • Ground Radar Engine
  </footer>

  <script>
    function connectBT() {
      const dot = document.getElementById('dot');
      const text = document.getElementById('btnText');
      text.innerText = "Aranıyor...";
      setTimeout(() => {
        dot.className = "w-3 h-3 rounded-full bg-green-500 inline-block";
        text.innerText = "Bağlandı";
      }, 1200);
    }
  </script>
</body>
</html>

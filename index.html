<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .nico { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 0 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <header>🤖 NICO AI Assistant (Gelişmiş Motor Aktif)</header>

    <div id="chat-box">
        <div class="message nico">Merhaba! Ben NICO. Karmaşık sorularını, kod analizlerini ve derinlemesine tüm meseleleri çözmeye hazırım. Bana ne sormak istiyorsun?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Karmaşık bir soru sor veya kod iste..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();

            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const nicoMsg = document.createElement('div');
                nicoMsg.className = 'message nico';
                
                const lower = text.toLowerCase();

                if (lower.includes('nasıl') || lower.includes('iyimis')) {
                    nicoMsg.textContent = "Sistemler tam kapasite çalışıyor! Karmaşık problemleri çözmek için sabırsızlanıyorum. Sen nasılsın?";
                } else if (lower.includes('kim') || lower.includes('üret') || lower.includes('yarad') || lower.includes('kur')) {
                    nicoMsg.textContent = "Beni sen (Ergin) var ettin ve bu akıllı ekosistemi birlikte inşa ettik!";
                } else if (lower.includes('kod') || lower.includes('yaz') || lower.includes('fonksiyon') || lower.includes('script')) {
                    nicoMsg.innerHTML = `İstediğin karmaşık mimari ve kod yapısı analiz edildi:<br><pre style="background:#090d16; padding:8px; margin-top:5px; border-radius:5px; color:#38bdf8;"># NICO Gelişmiş Motor\nimport sys\n\ndef analyze_complex_query(query):\n    print(f"Analiz ediliyor: {query}")\n    return "Optimizasyon tamamlandı, sistem kararlı."\n\nif __name__ == "__main__":\n    analyze_complex_query("Karmaşık görev")</pre>`;
                } else if (text.length > 30 || lower.includes('neden') || lower.includes('nasıl çalışır') || lower.includes('açıkla') || lower.includes('mimar') || lower.includes('mantık')) {
                    nicoMsg.innerHTML = `Harika ve derinlemesine bir soru sordun! Bu konuyu teknik açıdan şu şekilde analiz edebiliriz:<br><br>` +
                        `1. <b>Çekirdek Yapı:</b> Sorduğun bu mesele, sistemlerin mimari katmanlarında veri akışını ve optimizasyon süreçlerini doğrudan etkiler.<br>` +
                        `2. <b>Çözüm Stratejisi:</b> Bu tür yapıları çözerken modüler yaklaşım benimsemeli ve performans darboğazlarını (bottleneck) önceden hesaba katmalıyız.<br>` +
                        `3. <b>Uygulama Adımları:</b> Kod tarafında mantığı parçalara bölerek ilerlemek en sağlıklı sonuçları verecektir. Projende bu adımı nereye entegre edelim?`;
                } else if (lower.includes('merhaba') || lower.includes('selam')) {
                    nicoMsg.textContent = "Selam patron! Bugün masada hangi karmaşık problem var, hemen parçalamaya başlayalım?";
                } else {
                    nicoMsg.textContent = `"${text}" konusunu detaylıca inceledim. Bu karmaşık yapıyı çözmek için profesyonel bir algoritma kurabilir veya adım adım plan çıkarabiliriz. Hangi yönden başlayalım?`;
                }

                chatBox.appendChild(nicoMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>

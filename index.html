<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO AI</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        
        header { background: #1e293b; padding: 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header-info { display: flex; flex-direction: column; gap: 2px; }
        .title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
        .sub-header { font-size: 0.75rem; color: #94a3b8; }
        
        .header-btns { display: flex; gap: 8px; }
        .action-btn { background: #334155; color: #38bdf8; border: 1px solid #475569; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .action-btn:hover { background: #475569; }

        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .nico { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button.send-btn { padding: 0 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button.send-btn:hover { background: #0ea5e9; }
        .loading { color: #38bdf8; font-style: italic; }

        /* Modal Pencereler */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 90%; max-width: 350px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; text-align: center; }
        .modal-content h3 { color: #38bdf8; }
        .account-list { display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; text-align: left; }
        .account-item { padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; cursor: pointer; color: #f8fafc; font-size: 0.9rem; }
        .account-item:hover { border-color: #38bdf8; }
        .modal-content input { width: 100%; }
        .modal-content button.primary-btn { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="account-modal" class="modal">
        <div class="modal-content">
            <h3>🤖 Hesap Değiştir</h3>
            <div class="account-list" id="account-list-container"></div>
            <input type="text" id="modal-name-input" placeholder="Yeni Hesap Adı">
            <button class="primary-btn" onclick="addNewAccount()">Ekle ve Geçiş Yap</button>
        </div>
    </div>

    <div id="pwa-modal" class="modal">
        <div class="modal-content">
            <h3>📱 Uygulama Olarak Yükle</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; line-height: 1.4;">
                Bu arayüzü telefonunda tam ekran (tarayıcı çubuğu olmadan) çalıştırmak için tarayıcı menüsünden (üç nokta) <b>"Ana Ekrana Ekle"</b> veya <b>"Uygulamayı Yükle"</b> seçeneğini seçebilirsin!
            </p>
            <button class="primary-btn" onclick="closePwaModal()">Tamamdır</button>
        </div>
    </div>

    <header>
        <div class="header-info">
            <span class="title">🤖 NICO (Intek Mod)</span>
            <span class="sub-header" id="current-user-display">Aktif Hesap: Yükleniyor...</span>
        </div>
        <div class="header-btns">
            <button class="action-btn" onclick="openAccountModal()">Profil</button>
            <button class="action-btn" onclick="openPwaModal()">📲 Kur</button>
        </div>
    </header>

    <div id="chat-box">
        <div class="message nico" id="welcome-msg">Sistem aktif.</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Komutunu yaz..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        let accounts = JSON.parse(localStorage.getItem('nico_accounts')) || ["Sidar", "Ahmet", "Mehmet"];
        let currentUser = localStorage.getItem('nico_active_user') || accounts[0];

        window.onload = function() {
            if (!localStorage.getItem('nico_active_user')) {
                localStorage.setItem('nico_active_user', currentUser);
            }
            updateUI();
        };

        function openAccountModal() {
            const container = document.getElementById('account-list-container');
            container.innerHTML = '';
            accounts.forEach(acc => {
                const div = document.createElement('div');
                div.className = 'account-item';
                div.textContent = `👤 ${acc}`;
                div.onclick = () => switchAccount(acc);
                container.appendChild(div);
            });
            document.getElementById('account-modal').style.display = 'flex';
        }

        function switchAccount(name) {
            currentUser = name;
            localStorage.setItem('nico_active_user', currentUser);
            document.getElementById('account-modal').style.display = 'none';
            updateUI();
        }

        function addNewAccount() {
            const nameInput = document.getElementById('modal-name-input').value.trim();
            if (!nameInput) return;
            if (!accounts.includes(nameInput)) {
                accounts.push(nameInput);
                localStorage.setItem('nico_accounts', JSON.stringify(accounts));
            }
            currentUser = nameInput;
            localStorage.setItem('nico_active_user', currentUser);
            document.getElementById('account-modal').style.display = 'none';
            document.getElementById('modal-name-input').value = '';
            updateUI();
        }

        function openPwaModal() {
            document.getElementById('pwa-modal').style.display = 'flex';
        }

        function closePwaModal() {
            document.getElementById('pwa-modal').style.display = 'none';
        }

        function updateUI() {
            document.getElementById('current-user-display').textContent = `Aktif Hesap: ${currentUser}`;
            document.getElementById('welcome-msg').textContent = `Selam ${currentUser}! Intek/İncek modunda NICO emrinde. Profil değiştirebilir ya da uygulamayı telefona sabitleyebilirsin.`;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const nicoMsg = document.createElement('div');
            nicoMsg.className = 'message nico loading';
            nicoMsg.textContent = "NICO işliyor...";
            chatBox.appendChild(nicoMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                nicoMsg.className = 'message nico';
                nicoMsg.textContent = `[Intek Sürüm - ${currentUser}] Mesajın işlendi: "${text}" 🚀 İncek'ten selamlar, sistem tam gaz ayakta!`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }
    </script>
</body>
    </html>

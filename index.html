<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NICO AI</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<header>
    <div class="brand">🤖 NICO AI</div>
    <div class="user-badge">Sidar Aydın</div>
</header>


<div id="chat-container" class="chat-container">

<div class="message-row nico">
<div class="bubble">
Selam Sidar! NICO aktif. Yazabilirsin.
</div>
</div>

</div>



<div class="input-wrapper">

<div class="input-box">

<input 
id="user-input"
placeholder="NICO'ya yaz..."
autocomplete="off">


<button id="send-button">
➤
</button>


</div>

</div>



<script src="storage.js"></script>
<script src="app.js"></script>


<script>

if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

</script>


</body>
</html>

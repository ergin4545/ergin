<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ERGİN 3D - DEDSIS DSM-X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #000000; color: #fff; margin: 0; padding: 0; height: 100vh; overflow: hidden; font-family: sans-serif; }
    .screen-page { display: none; height: 100vh; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; }
    .screen-page.active { display: flex; }
    .card-btn {
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
    }
    .card-btn:active { transform: scale(0.96); background: #18181b; }
    canvas { background: #050505; border-radius: 12px; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <!-- ANA MENÜ EKRANI -->
  <div id="pageMenu" class="screen-page active max-w-md mx-auto">
    <div class="flex justify-between items-center px-1 pt-1">
      <h1 class="text-2xl font-black tracking-wider text-white">ERGİN 3D</h1>
      <div class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-xl text-xs">
        <span class="text-emerald-400 font-bold">7.8V</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3.5 my-auto">
      <div onclick="showScanScreen('3D Zemin Taraması')" class="card-btn aspect-square p-4">
        <div class="text-4xl mb-2">🛰️</div>
        <span class="text-xs font-bold text-gray-200">3D Zemin Taraması</span>
      </div>

      <div onclick="showScanScreen('Uzun Menzilli (LRL)')" class="card-btn aspect-square p-4">
        <div class="text-4xl mb-2">📡</div>
        <span class="text-xs font-bold text-gray-200">Uzun Menzilli (LRL)</span>
      </div>

      <div onclick="showScanScreen('Eş Zamanlı Veri')" class="card-btn aspect-square p-4">
        <div class="text-4xl mb-2">📈</div>
        <span class="text-xs font-bold text-gray-200">Eş Zamanlı Veri</span>
      </div>

      <div onclick="alert('Kayıtlı tarama bulunmuyor.')" class="card-btn aspect-square p-4">
        <div class="text-4xl mb-2">📁</div>
        <span class="text-xs font-bold text-gray-200">Kayıtlı Taramalar</span>
      </div>

      <div onclick="alert('Lisans Durumu: Aktif')" class="card-btn aspect-square p-4">
        <div class="text-4xl mb-2">🔑</div>
        <span class="text-xs font-bold text-gray-200">Lisans Durumu</span>
      </div>

      <div onclick="alert('DEDSIS DSM-X 3D Pulse System v2.4')" class="card-btn aspect-square p-4">
        <div class="text-4xl mb-2">ℹ️</div>
        <span class="text-xs font-bold text-gray-200">Cihaz Bilgisi</span>
      </div>
    </div>
  </div>

  <!-- 3D GRAFİK / TARAMA EKRANI (Videodaki Asıl Ekran) -->
  <div id="pageScan" class="screen-page max-w-md mx-auto">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
      <button onclick="goToMenu()" class="bg-zinc-800 text-xs px-3 py-1.5 rounded-xl font-bold">← Menü</button>
      <span id="scanTitle" class="text-cyan-400 font-bold text-sm">3D Zemin Taraması</span>
      <span class="text-emerald-400 text-xs font-bold">Bağlı</span>
    </div>

    <!-- 3D Dalga / Grafik Alanı -->
    <div class="relative flex-1 my-2 bg-zinc-950 border border-zinc-800 rounded-2xl overflow-hidden flex flex-col items-center justify-center p-1">
      <canvas id="pulseCanvas"></canvas>
      <div id="scanInfoOverlay" class="absolute bottom-2 left-2 right-2 bg-black/80 backdrop-blur p-2 rounded-xl border border-zinc-800 text-[11px] flex justify-between">
        <span class="text-cyan-300 font-bold">Durum: Tarama Bekleniyor</span>
        <span class="text-emerald-400 font-bold">Derinlik: 0.0m</span>
      </div>
    </div>

    <!-- Kontrol Paneli Tuşları -->
    <div class="grid grid-cols-4 gap-2">
      <button onclick="startPulseScan()" class="bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-3 rounded-xl shadow">BAŞLAT</button>
      <button onclick="resetPulseScan()" class="bg-amber-600 hover:bg-amber-500 font-bold text-xs py-3 rounded-xl shadow">SIFIRLA</button>
      <button onclick="alert('Tarama kaydedildi.')" class="bg-blue-600 hover:bg-blue-500 font-bold text-xs py-3 rounded-xl shadow">KAYDET</button>
      <button onclick="goToMenu()" class="bg-zinc-700 hover:bg-zinc-600 font-bold text-xs py-3 rounded-xl shadow">ÇIKIŞ</button>
    </div>
  </div>

  <script>
    function showScanScreen(title) {
      document.getElementById('pageMenu').classList.remove('active');
      document.getElementById('pageScan').classList.add('active');
      document.getElementById('scanTitle').innerText = title;
      initCanvas();
    }

    function goToMenu() {
      document.getElementById('pageScan').classList.remove('active');
      document.getElementById('pageMenu').classList.add('active');
    }

    let canvas, ctx, animationId;
    function initCanvas() {
      canvas = document.getElementById('pulseCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      drawGrid(0);
    }

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }

    function drawGrid(offset) {
      if(!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Arka plan çizgileri (Grid)
      ctx.strokeStyle = '#18181b';
      ctx.lineWidth = 1;
      let step = 30;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 3D Dalga Çizgisi
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < canvas.width; i++) {
        let y = canvas.height / 2 + Math.sin((i + offset) * 0.03) * 20 + Math.cos((i - offset) * 0.02) * 15;
        if (i === 0) ctx.moveTo(i, y);
        else ctx.lineTo(i, y);
      }
      ctx.stroke();
    }

    function startPulseScan() {
      let offset = 0;
      document.getElementById('scanInfoOverlay').innerHTML = '<span class="text-amber-300 font-bold animate-pulse">🛰️ Zemin taranıyor...</span><span class="text-emerald-400 font-bold">Veri alınıyor</span>';
      
      if(animationId) cancelAnimationFrame(animationId);
      function animate() {
        offset += 3;
        drawGrid(offset);
        animationId = requestAnimationFrame(animate);
      }
      animate();
    }

    function resetPulseScan() {
      if(animationId) cancelAnimationFrame(animationId);
      drawGrid(0);
      document.getElementById('scanInfoOverlay').innerHTML = '<span class="text-cyan-300 font-bold">Durum: Sıfırlandı</span><span class="text-emerald-400 font-bold">Derinlik: 0.0m</span>';
    }
  </script>
</body>
</html>

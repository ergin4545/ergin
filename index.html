<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NICO AI Assistant</title>

<style>

:root {
    --bg:#131314;
    --surface:#1e1f20;
    --border:#333537;
    --text:#e3e3e3;
    --accent:#8ab4f8;
}


*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial, sans-serif;
}


body{

height:100vh;
background:var(--bg);
color:var(--text);

display:flex;
flex-direction:column;

overflow:hidden;

}


/* HEADER */

header{

height:55px;

background:var(--surface);

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:10px 15px;

}


.brand{

display:flex;
align-items:center;
gap:10px;

}


.brand img{

width:32px;
height:32px;

border-radius:50%;

}


.brand span{

font-weight:bold;
color:white;

}


.btn-clear{

background:#ff5252;

color:white;

border:0;

padding:6px 12px;

border-radius:15px;

cursor:pointer;

}


/* CHAT */


.chat-container{

flex:1;

overflow-y:auto;

padding:20px;

display:flex;

flex-direction:column;

gap:15px;

max-width:900px;

width:100%;

margin:auto;

}



.message-row{

display:flex;

gap:10px;

max-width:90%;

}


.message-row.user{

align-self:flex-end;

}


.message-row.nico{

align-self:flex-start;

}


.avatar{

width:35px;

height:35px;

border-radius:50%;

background:#333;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}


.avatar img{

width:100%;
height:100%;

object-fit:cover;

}



.bubble{

padding:12px 15px;

border-radius:15px;

line-height:1.5;

font-size:15px;

}


.user .bubble{

background:#2b313a;

color:white;

}


.nico .bubble{

background:var(--surface);

border:1px solid var(--border);

}



/* INPUT */


.input-wrapper{

padding:15px;

max-width:900px;

width:100%;

margin:auto;

}



.input-box{

background:var(--surface);

border:1px solid var(--border);

border-radius:30px;

display:flex;

align-items:center;

padding:8px 15px;

gap:10px;

}



.input-box input{

flex:1;

background:none;

border:0;

outline:none;

color:white;

font-size:16px;

}



.file-btn{

cursor:pointer;

font-size:20px;

}



.send-btn{

width:40px;

height:40px;

border-radius:50%;

border:0;

background:var(--accent);

cursor:pointer;

font-size:20px;

}



.msg-actions{

margin-top:8px;

}


.msg-btn{

background:none;

border:1px solid #555;

color:#aaa;

padding:4px 10px;

border-radius:8px;

cursor:pointer;

}


.typing{

opacity:.6;

}


#image-preview-container{

display:none;

padding:10px;

}


.preview-box{

background:#222;

padding:8px;

border-radius:10px;

display:inline-flex;

align-items:center;

gap:8px;

}


.preview-box img{

width:40px;

height:40px;

object-fit:cover;

border-radius:5px;

}



.remove-img{

color:red;

cursor:pointer;

}



</style>

</head>


<body>


<header>

<div class="brand">

<img src="logo.png">

<span>NICO AI</span>

</div>


<button class="btn-clear" onclick="clearChat()">
Temizle
</button>


</header>



<div class="chat-container" id="chat-container">


<div class="message-row nico">

<div class="avatar">

<img src="logo.png">

</div>


<div class="bubble">

Selam Sidar! Ben NICO AI. Gemini motoruna bağlanmaya hazırım.

</div>


</div>


</div>




<div id="image-preview-container">

<div class="preview-box">

<img id="preview-thumb">

<span id="preview-name"></span>

<span class="remove-img" onclick="clearImage()">✕</span>


</div>

</div>





<div class="input-wrapper">


<div class="input-box">


<label class="file-btn">

📎

<input 
id="file-input"
type="file"
accept="image/*"
hidden
onchange="handleFileSelect(event)"
>

</label>


<input 
id="user-input"
placeholder="NICO'ya yaz..."
onkeypress="checkEnter(event)"
>


<button class="send-btn" onclick="sendMessage()">

➤

</button>


</div>


</div>
<script>

const API_URL = "https://bitter-haze-2503.usermame5252.workers.dev";

let selectedImageBase64 = null;


// Sayfa açılınca geçmişi yükle

window.onload = () => {
    loadHistory();
};



// Görsel seçme

function handleFileSelect(event){

    const file = event.target.files[0];

    if(!file) return;


    const reader = new FileReader();


    reader.onload = function(e){

        selectedImageBase64 = e.target.result;


        document.getElementById("preview-thumb").src =
        selectedImageBase64;


        document.getElementById("preview-name").innerText =
        file.name;


        document.getElementById(
        "image-preview-container"
        ).style.display="block";

    };


    reader.readAsDataURL(file);

}



// Görsel temizleme

function clearImage(){

    selectedImageBase64=null;

    document.getElementById("file-input").value="";

    document.getElementById(
    "image-preview-container"
    ).style.display="none";

}




// Mesaj gönderme

async function sendMessage(){


    const input =
    document.getElementById("user-input");


    const text =
    input.value.trim();



    if(!text && !selectedImageBase64)
    return;



    appendMessage(
        text,
        "user",
        selectedImageBase64
    );


    saveHistory(
        text,
        "user",
        selectedImageBase64
    );



    input.value="";



    const image =
    selectedImageBase64;


    clearImage();



    const loading =
    "loading-"+Date.now();



    appendMessage(
        "NICO düşünüyor...",
        "nico",
        null,
        loading,
        true
    );



    try{


        const response =
        await fetch(
        API_URL,
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },


            body:JSON.stringify({

                message:text,

                image:image

            })

        });



        const data =
        await response.json();



        removeMessage(loading);



        const reply =
        data.reply || 
        "Cevap alınamadı.";



        appendMessage(
            reply,
            "nico"
        );



        saveHistory(
            reply,
            "nico",
            null
        );



    }
    catch(error){


        removeMessage(loading);



        appendMessage(
            "Bağlantı hatası: "+error.message,
            "nico"
        );


    }



}




// Mesaj ekleme

function appendMessage(
text,
sender,
imgData=null,
customId="",
typing=false
){


const container =
document.getElementById("chat-container");


const row =
document.createElement("div");


row.className =
"message-row "+sender;



if(customId)
row.id=customId;



const avatar =
document.createElement("div");


avatar.className="avatar";



const bubble =
document.createElement("div");


bubble.className="bubble";



if(typing)
bubble.classList.add("typing");



if(sender==="nico"){

const img =
document.createElement("img");

img.src="logo.png";

avatar.appendChild(img);


}else{

avatar.innerText="S";

}




if(text){

const t =
document.createElement("div");

t.innerText=text;

bubble.appendChild(t);

}



if(imgData){

const image =
document.createElement("img");

image.src=imgData;

image.style.maxWidth="250px";

bubble.appendChild(image);

}




if(sender==="user"){

row.appendChild(bubble);

row.appendChild(avatar);


}else{


if(!typing){


const actions =
document.createElement("div");


actions.className="msg-actions";


const btn =
document.createElement("button");


btn.className="msg-btn";

btn.innerText="Kopyala";


btn.onclick=()=>{

navigator.clipboard.writeText(text);

btn.innerText="Kopyalandı!";

setTimeout(()=>{

btn.innerText="Kopyala";

},1500);


};



actions.appendChild(btn);

bubble.appendChild(actions);


}



row.appendChild(avatar);

row.appendChild(bubble);


}



container.appendChild(row);


container.scrollTop =
container.scrollHeight;


}




function removeMessage(id){

const el =
document.getElementById(id);

if(el)
el.remove();

}




// Geçmiş kaydetme

function saveHistory(text,sender,img){


let history =
JSON.parse(
localStorage.getItem("nico_history")
)||[];


history.push({

text:text,

sender:sender,

img:img

});


localStorage.setItem(
"nico_history",
JSON.stringify(history)
);


}




// Geçmiş yükleme

function loadHistory(){


let history =
JSON.parse(
localStorage.getItem("nico_history")
)||[];


history.forEach(item=>{


appendMessage(
item.text,
item.sender,
item.img
);


});


}




// Temizleme

function clearChat(){


if(confirm("Sohbet temizlensin mi?")){


localStorage.removeItem(
"nico_history"
);


document.getElementById(
"chat-container"
).innerHTML="";


appendMessage(
"NICO yeniden hazır.",
"nico"
);


}


}




function checkEnter(e){

if(e.key==="Enter"){

sendMessage();

}

}


</script>


</body>
    </html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <img src="logo.png" alt="NICO Logo" class="logo-img">
        </div>
        <h1>NICO</h1>
        <p class="subtitle">AI Assistant</p>
        
        <div class="chat-box" id="chatBox">
            <div class="message nico-msg">Merhaba patron! Süper güçleri aktif etme operasyonu başladı. Beni dinliyorum!</div>
        </div>

        <div class="input-area">
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <button id="uploadBtn" title="Fotoğraf Yükle">📷</button>
            <input type="text" id="userInput" placeholder="Nico'ya bir şeyler yaz...">
            <button id="sendBtn">Gönder</button>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>

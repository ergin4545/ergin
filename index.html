<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; font-size: 1.2rem; font-weight: bold; color: #38bdf8; display: flex; flex-direction: column; gap: 4px; }
        .sub-header { font-size: 0.75rem; color: #94a3b8; font-weight: normal; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .nico { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; flex-direction: column; }
        .api-box { display: flex; gap: 5px; }
        .api-box input { font-size: 0.85rem; padding: 8px; border-radius: 6px; }
        .main-input { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 0 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .loading { color: #38bdf8; font-style: italic; }
    </style>
</head>
<body>

    <header>
        🤖 NICO AI Assistant
        <span class="sub-header">Geliştirici: Sidar Aydın | Sınırsız Akıllı Motor</span>
    </header>

    <div id="chat-box">
        <div class="message nico">Merhaba Sidar! Ben NICO. Artık hafızamda sabit kalıplar yok; bana ne sorarsan sor, anında sana özel ve akıllı cevaplar üretiyorum. Nasıl yardımcı olayım?</div>
    </div>

    <div class="input-area">
        <div class="api-box">
            <input type="password" id="api-key" placeholder="Google Gemini API Anahtarını buraya gir (İlk kullanımda gerekli)...">
        </div>
        <div class="main-input">
            <input type="text" id="user-input" placeholder="Ne istersen sor (kod, fikir, karmaşık soru)..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const apiKeyField = document.getElementById('api-key');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();
            const apiKey = apiKeyField.value.trim();

            if (!text) return;

            // Kullanıcı mesajı ekleniyor
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor balonu
            const nicoMsg = document.createElement('div');
            nicoMsg.className = 'message nico loading';
            nicoMsg.textContent = "NICO düşünüyor...";
            chatBox.appendChild(nicoMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Eğer API anahtarı girilmediyse kullanıcıya rehberlik edelim
            if (!apiKey) {
                nicoMsg.className = 'message nico';
                nicoMsg.textContent = "Sidar, sınırsız ve her soruya özgün cevap verebilmem için lütfen üstteki kutuya Google Gemini API anahtarını yapıştır.\n\n(Google AI Studio'dan ücretsiz olarak kolayca alabilirsin!)";
                chatBox.scrollTop = chatBox.scrollHeight;
                return;
            }

            try {
                // Doğrudan Gemini AI beynine istek atılıyor (Ne sorarsan sor oradan cevap gelir)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Senin adın NICO. Geliştiricinin adı Sidar Aydın. Kullanıcı sana ne sorarsa sorsun, her dilde, her konuda en akıllı, profesyonel ve eksiksiz yanıtı ver. Soru: ${text}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    nicoMsg.className = 'message nico';
                    nicoMsg.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    nicoMsg.className = 'message nico';
                    nicoMsg.textContent = "Üzgünüm, yanıt alınamadı. API anahtarını kontrol edebilir misin?";
                }
            } catch (error) {
                nicoMsg.className = 'message nico';
                nicoMsg.textContent = "Bağlantı hatası oluştu. İnternetini veya API anahtarını kontrol et.";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

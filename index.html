<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGİN 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col justify-between p-3 select-none">

  <!-- Header -->
  <header class="flex justify-between items-center py-1 border-b border-gray-800">
    <div class="flex items-center gap-2">
      <h1 class="text-xl font-black text-cyan-400 tracking-wider">ERGİN 3D</h1>
    </div>
    <div class="text-2xl">🇹🇷</div>
  </header>

  <!-- 6'lı Izgara Menü -->
  <main class="grid grid-cols-2 gap-3 my-auto">
    
    <button onclick="window.location.href='scan.html'" class="bg-gradient-to-b from-gray-200 to-gray-400 text-black rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg active:scale-95 transition border border-gray-300">
      <div class="text-3xl mb-1">🗺️</div>
      <span class="font-bold text-sm leading-tight">3D Ground Scan</span>
    </button>

    <button onclick="window.location.href='scan.html'" class="bg-gradient-to-b from-gray-200 to-gray-400 text-black rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg active:scale-95 transition border border-gray-300">
      <div class="text-3xl mb-1">📡</div>
      <span class="font-bold text-sm leading-tight">Long Range Locator</span>
    </button>

    <button onclick="window.location.href='scan.html'" class="bg-gradient-to-b from-gray-200 to-gray-400 text-black rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg active:scale-95 transition border border-gray-300">
      <div class="text-3xl mb-1">📈</div>
      <span class="font-bold text-sm leading-tight">Simultaneous Data</span>
    </button>

    <button onclick="window.location.href='scan.html'" class="bg-gradient-to-b from-gray-200 to-gray-400 text-black rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg active:scale-95 transition border border-gray-300">
      <div class="text-3xl mb-1">📁</div>
      <span class="font-bold text-sm leading-tight">Open Scan</span>
    </button>

    <button onclick="window.location.href='scan.html'" class="bg-gradient-to-b from-gray-200 to-gray-400 text-black rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg active:scale-95 transition border border-gray-300">
      <div class="text-3xl mb-1">🔑</div>
      <span class="font-bold text-sm leading-tight">Licence</span>
    </button>

    <button onclick="window.location.href='scan.html'" class="bg-gradient-to-b from-gray-200 to-gray-400 text-black rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg active:scale-95 transition border border-gray-300">
      <div class="text-3xl mb-1">ℹ️</div>
      <span class="font-bold text-sm leading-tight">Information</span>
    </button>

  </main>

  <!-- Alt Durum Çubuğu -->
  <footer class="bg-gray-900 border border-gray-800 rounded-xl p-2 flex justify-between items-center text-xs">
    <div class="bg-gray-800 text-amber-400 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-gray-700">
      🔵 Bluetooth Bekleniyor
    </div>

    <div class="flex items-center gap-3">
      <div class="text-left">
        <div class="text-gray-400 font-medium">ERGİN 3D-X</div>
        <div class="text-emerald-400 font-bold">🔋 7.81 V</div>
      </div>
    </div>
  </footer>

</body>
</html>

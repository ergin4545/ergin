<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO - Kişisel Yapay Zeka Asistanı</title>
    <style>
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --text-color: #e3e3e3;
            --accent-color: #8ab4f8;
            --border-color: #333537;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Giriş Modalı */
        #auth-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: var(--surface-color); padding: 32px; border-radius: 24px; width: 100%; max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid var(--border-color); text-align: center;
        }
        .auth-box h2 { margin-bottom: 8px; font-size: 24px; color: #fff; }
        .auth-box p { font-size: 14px; color: #999; margin-bottom: 24px; line-height: 1.4; }
        .auth-btn {
            width: 100%; padding: 12px 16px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border-color);
            background: #2d2e30; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;
        }
        .auth-btn:hover { background: #3c3d40; }
        .divider { margin: 16px 0; font-size: 12px; color: #666; position: relative; }
        .email-input {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color);
            background: #131314; color: #fff; margin-bottom: 12px; font-size: 15px; outline: none;
        }

        /* Sohbet Ekranı */
        #chat-container { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 800px; margin: 0 auto; padding: 16px; display: none; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 16px; }
        .message { padding: 12px 16px; border-radius: 16px; max-width: 80%; line-height: 1.5; font-size: 15px; }
        .message.user { background: #2b313a; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.nico { background: var(--surface-color); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
        .input-area { display: flex; gap: 10px; padding-top: 16px; }
        .input-area input {
            flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid var(--border-color);
            background: var(--surface-color); color: #fff; font-size: 15px; outline: none;
        }
        .input-area button {
            padding: 0 24px; border-radius: 24px; border: none; background: var(--accent-color); color: #131314; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Oturum Açma Modalı -->
    <div id="auth-modal">
        <div class="auth-box">
            <h2>Oturum aç veya kaydol</h2>
            <p>Daha akıllı yanıtlar alabilir, hafıza özelliğini kullanabilir ve NICO ile kesintisiz sohbet edebilirsin.</p>
            
            <button class="auth-btn" onclick="loginSuccess('Google')">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Google ile devam et
            </button>
            <button class="auth-btn" onclick="loginSuccess('Apple')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 5.35c.57-.69.96-1.65.85-2.61-.84.04-1.85.56-2.45 1.25-.53.6-.99 1.58-.87 2.54.94.07 1.9-.49 2.47-1.18z"/></svg>
                Apple ile devam et
            </button>

            <div class="divider">YA DA</div>

            <input type="email" id="user-email" class="email-input" placeholder="E-posta adresi">
            <button class="auth-btn" style="background: var(--accent-color); color: #131314;" onclick="loginSuccess('Email')">Devam</button>
        </div>
    </div>

    <!-- Sohbet Arayüzü -->
    <div id="chat-container">
        <div class="chat-header">
            <h3>NICO Hafıza & Asistan</h3>
            <span id="user-display" style="font-size: 13px; color: #8ab4f8;"></span>
        </div>
        <div class="messages" id="messages">
            <div class="message nico">Merhaba! Oturum açtın, artık tüm konuşmalarımız hafızama kaydediliyor. Sana nasıl yardımcı olabilirim?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="NICO'ya bir şey yaz..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        function loginSuccess(method) {
            const email = method === 'Email' ? document.getElementById('user-email').value : method + ' Kullanıcısı';
            if(method === 'Email' && !email) { alert('Lütfen bir e-posta adresi girin.'); return; }
            
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('chat-container').style.display = 'flex';
            document.getElementById('user-display').innerText = email;
            localStorage.setItem('nico_user', email);
        }

        // Oturum hafızası kontrolü
        window.onload = function() {
            const savedUser = localStorage.getItem('nico_user');
            if(savedUser) {
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('chat-container').style.display = 'flex';
                document.getElementById('user-display').innerText = savedUser;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            appendMessage(text, 'user');
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, user: localStorage.getItem('nico_user') })
                });
                const data = await response.json();
                appendMessage(data.reply, 'nico');
            } catch(e) {
                setTimeout(() => {
                    appendMessage("Mesajın alındı ve hafızaya kaydedildi! Anında işleme alıyorum.", 'nico');
                }, 300);
            }
        }

        function appendMessage(text, sender) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>

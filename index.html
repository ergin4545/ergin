<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00a2ff">
  <title>ERGİN 3D Pro - Pulse System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Plotly 3D Kütüphanesi -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    .screen-page { display: none !important; }
    .screen-page.active { display: flex !important; }
    body { background: #0b0b0b; }
    .glass-card {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="text-white h-screen w-screen select-none m-0 p-3 overflow-hidden flex flex-col justify-between">

  <!-- ANA MENÜ -->
  <div id="pageMenu" class="screen-page active flex-col justify-between h-full w-full max-w-md mx-auto">
    <div class="flex justify-between items-center pt-1 px-1">
      <h1 class="text-2xl font-black text-white tracking-wider">ERGİN 3D</h1>
      <div class="flex items-center gap-1 bg-black/40 px-2 py-1 rounded-lg border border-white/10 text-xs">
        <span class="text-emerald-400 font-bold">7.8V</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3.5 my-auto py-2">
      <button onclick="showPage('pageScan')" class="glass-card p-4 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl active:scale-95 transition-all aspect-square">
        <div class="w-16 h-16 mb-2 flex items-center justify-center text-4xl">🛰️</div>
        <span class="text-xs font-semibold leading-tight">Uydu & 3D Zemin Taraması</span>
      </button>

      <button onclick="showPage('pageScan')" class="glass-card p-4 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl active:scale-95 transition-all aspect-square">
        <div class="w-16 h-16 mb-2 flex items-center justify-center text-4xl">📡</div>
        <span class="text-xs font-semibold leading-tight">LRL-ION Taraması</span>
      </button>

      <button onclick="showPage('pageScan')" class="glass-card p-4 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl active:scale-95 transition-all aspect-square">
        <div class="w-16 h-16 mb-2 flex items-center justify-center text-4xl">📈</div>
        <span class="text-xs font-semibold leading-tight">Gerçek Zamanlı Tarama</span>
      </button>

      <button onclick="openSavedScansPage()" class="glass-card p-4 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl active:scale-95 transition-all aspect-square">
        <div class="w-16 h-16 mb-2 flex items-center justify-center text-4xl">📁</div>
        <span class="text-xs font-semibold leading-tight">Tarama Aç</span>
      </button>

      <button onclick="showPage('pageLicence')" class="glass-card p-4 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl active:scale-95 transition-all aspect-square">
        <div class="w-16 h-16 mb-2 flex items-center justify-center text-4xl">🔑</div>
        <span class="text-xs font-semibold leading-tight">Lisans</span>
      </button>

      <button onclick="showPage('pageInfo')" class="glass-card p-4 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl active:scale-95 transition-all aspect-square">
        <div class="w-16 h-16 mb-2 flex items-center justify-center text-4xl">ℹ️</div>
        <span class="text-xs font-semibold leading-tight">Bilgi</span>
      </button>
    </div>
  </div>

  <!-- KAYITLI TARAMALAR LİSTESİ VE TEK TEK SİLME EKRANI -->
  <div id="pageSavedScans" class="screen-page flex-col justify-between h-full w-full max-w-md mx-auto py-2">
    <div class="flex justify-between items-center pb-2 border-b border-white/20">
      <h2 class="text-base font-bold text-cyan-400">Kayıtlı Taramalar</h2>
      <button onclick="showPage('pageMenu')" class="bg-white/20 text-xs px-3 py-1 rounded-lg">← Menü</button>
    </div>
    
    <!-- Liste Alanı -->
    <div id="savedScansListContainer" class="my-auto w-full flex-1 overflow-y-auto space-y-2 py-2 pr-1">
      <!-- Dinamik olarak doldurulacak -->
    </div>

    <button onclick="showPage('pageMenu')" class="bg-cyan-600 font-bold p-3 rounded-2xl w-full text-xs">Ana Menüye Dön</button>
  </div>

  <!-- 3D TARAMA VE HARİTA EKRANI -->
  <div id="pageScan" class="screen-page flex-col justify-between h-full w-full max-w-md mx-auto py-1">
    <header class="flex flex-col gap-1.5 px-3 py-2 text-xs border border-white/20 glass-card rounded-2xl">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <button onclick="showPage('pageMenu')" class="bg-white/20 hover:bg-white/30 text-white px-2 py-0.5 rounded text-[10px] font-bold">← Geri</button>
          <span class="font-bold text-cyan-400">ERGİN 3D</span>
        </div>
        <div id="signalDisplay" class="font-bold text-amber-400">SİNYAL: 85</div>
        <div id="btStatus" class="text-amber-400 font-bold">🔴 Bağlı Değil</div>
      </div>
      <div class="text-[11px] text-gray-300 px-0.5">Konum: <span id="coordDisplay">38.710332, 27.908520</span></div>
      <!-- Yer Arama Çubuğu -->
      <div class="flex gap-1">
        <input type="text" id="searchLocationInput" placeholder="Yer Ara (Örn: Manisa Gölmarmara)" class="w-full bg-black/60 border border-white/30 px-2.5 py-1.5 rounded-lg text-white text-xs outline-none">
        <button onclick="searchLocation()" class="bg-cyan-600 px-3 py-1.5 rounded-lg font-bold text-xs active:scale-95">Git</button>
      </div>
    </header>

    <!-- 3D Grafik / Uydu Alanı -->
    <main class="relative w-full flex-1 bg-zinc-950 my-2 rounded-2xl border border-white/20 overflow-hidden flex flex-col items-center justify-center">
      <div id="scanPlot" class="w-full h-full"></div>
    </main>

    <!-- Buton Paneli -->
    <footer class="flex flex-col gap-1.5 glass-card p-2 rounded-2xl">
      <div class="grid grid-cols-5 gap-1 text-[10px]">
        <button onclick="setPlotMode('surface')" id="btnModeUydu" class="bg-purple-600 text-white font-bold py-1.5 rounded-lg active:scale-95">Uydu</button>
        <button onclick="setPlotMode('3d')" id="btnMode3D" class="bg-gray-700 text-white font-bold py-1.5 rounded-lg active:scale-95">3D Açı</button>
        <button onclick="setPlotMode('2d')" id="btnMode2D" class="bg-gray-700 text-white font-bold py-1.5 rounded-lg active:scale-95">2D Kuş</button>
        <button onclick="setPlotMode('wireframe')" id="btnModeWire" class="bg-gray-700 text-white font-bold py-1.5 rounded-lg active:scale-95">Tel Örgü</button>
        <button onclick="setPlotMode('depth')" id="btnModeDepth" class="bg-emerald-700 text-white font-bold py-1.5 rounded-lg active:scale-95">Derinlik</button>
      </div>
      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="startLiveScan()" class="bg-emerald-600 text-white font-bold text-xs rounded-xl py-2 shadow active:scale-95">BAŞLAT</button>
        <button onclick="stopScan()" class="bg-amber-800 text-white font-bold text-xs rounded-xl py-2 shadow active:scale-95">DURDUR</button>
        <button onclick="saveScan()" class="bg-blue-600 text-white font-bold text-xs rounded-xl py-2 shadow active:scale-95">KAYDET</button>
      </div>
      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="clearScan()" class="bg-rose-800 text-white font-bold text-xs rounded-xl py-2 shadow active:scale-95">TEMİZLE</button>
        <button onclick="connectBluetoothDevice()" class="bg-amber-400 text-black font-bold text-xs rounded-xl py-2 shadow active:scale-95">BAĞLAN</button>
        <button onclick="showPage('pageMenu')" class="bg-slate-700 text-white font-bold text-xs rounded-xl py-2 shadow active:scale-95">MENÜ</button>
      </div>
    </footer>
  </div>

  <!-- LİSANS EKRANI -->
  <div id="pageLicence" class="screen-page flex-col justify-between h-full w-full max-w-md mx-auto py-2">
    <div class="flex justify-between items-center pb-2 border-b border-white/20">
      <h2 class="text-base font-bold text-cyan-400">Lisans Bilgileri</h2>
      <button onclick="showPage('pageMenu')" class="bg-white/20 text-xs px-3 py-1 rounded-lg">← Geri</button>
    </div>
    <div class="my-auto space-y-3 w-full">
      <div class="glass-card p-4 rounded-2xl text-xs space-y-2">
        <p><strong class="text-gray-300">Cihaz Kimliği:</strong> ERGIN-PULSE-3D</p>
        <p><strong class="text-gray-300">Durum:</strong> <span class="text-emerald-400 font-bold">Aktif Lisans</span></p>
      </div>
      <div class="glass-card p-4 rounded-2xl space-y-2">
        <input type="text" id="licenseInput" placeholder="ERGIN2026" class="w-full bg-black/60 border border-white/30 p-2.5 rounded-xl text-white text-center text-xs outline-none">
        <button onclick="activateLicense()" class="w-full bg-emerald-600 font-bold p-2.5 rounded-xl text-white text-xs">AKTİFLEŞTİR</button>
      </div>
    </div>
    <button onclick="showPage('pageMenu')" class="bg-cyan-600 font-bold p-3 rounded-2xl w-full text-xs">Ana Menüye Dön</button>
  </div>

  <!-- BİLGİ EKRANI -->
  <div id="pageInfo" class="screen-page flex-col justify-between h-full w-full max-w-md mx-auto py-2">
    <div class="flex justify-between items-center pb-2 border-b border-white/20">
      <h2 class="text-base font-bold text-cyan-400">Cihaz Bilgisi</h2>
      <button onclick="showPage('pageMenu')" class="bg-white/20 text-xs px-3 py-1 rounded-lg">← Geri</button>
    </div>
    <div class="glass-card p-4 rounded-2xl my-auto text-xs space-y-2 text-gray-200">
      <p>• ERGİN 3D Pulse System</p>
      <p>• Bluetooth Canlı Veri Aktarım Altyapısı</p>
    </div>
    <button onclick="showPage('pageMenu')" class="bg-cyan-600 font-bold p-3 rounded-2xl w-full text-xs">Ana Menüye Dön</button>
  </div>

  <script>
    let bluetoothDevice = null;
    let currentPlotMode = 'surface';
    let currentZValues = [
      [2, 3, 4, 3, 2, 3, 4, 3, 2, 2],
      [3, 5, 7, 6, 4, 5, 6, 5, 3, 3],
      [4, 7, 10, 9, 6, 7, 9, 7, 4, 4],
      [5, 9, 13, 12, 8, 9, 12, 9, 5, 5],
      [6, 11, 16, 15, 10, 11, 15, 11, 6, 6],
      [6, 11, 16, 15, 10, 11, 15, 11, 6, 6],
      [5, 9, 13, 12, 8, 9, 12, 9, 5, 5],
      [4, 7, 10, 9, 6, 7, 9, 7, 4, 4],
      [3, 5, 7, 6, 4, 5, 6, 5, 3, 3],
      [2, 3, 4, 3, 2, 3, 4, 3, 2, 2]
    ];

    // Örnek Kayıtlı Taramalar Listesi
    let savedScans = [
      { id: 1, name: "Tarama_01_Bolge_A.dat", date: "24.07.2026 - 21:10" },
      { id: 2, name: "Manisa_Golkarmara_Hedef2.dat", date: "24.07.2026 - 20:45" },
      { id: 3, name: "Test_Zemin_Analizi.dat", date: "23.07.2026 - 18:30" }
    ];

    window.onload = function() {
      showPage('pageMenu');
    };

    function showPage(pageId) {
      document.querySelectorAll('.screen-page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      if (pageId === 'pageScan') {
        setTimeout(() => {
          renderPlot();
          Plotly.Plots.resize('scanPlot');
        }, 150);
      }
    }

    function openSavedScansPage() {
      renderSavedScansList();
      showPage('pageSavedScans');
    }

    function renderSavedScansList() {
      let container = document.getElementById('savedScansListContainer');
      container.innerHTML = '';

      if (savedScans.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 text-xs py-10">Hiç kayıtlı tarama bulunmuyor.</div>';
        return;
      }

      savedScans.forEach(scan => {
        let item = document.createElement('div');
        item.className = "glass-card p-3 rounded-xl flex justify-between items-center text-xs";
        item.innerHTML = `
          <div>
            <div class="font-bold text-cyan-300">${scan.name}</div>
            <div class="text-[10px] text-gray-400">${scan.date}</div>
          </div>
          <div class="flex gap-1.5">
            <button onclick="loadScan(${scan.id})" class="bg-blue-600 px-2.5 py-1.5 rounded-lg font-bold active:scale-95">Aç</button>
            <button onclick="deleteSingleScan(${scan.id})" class="bg-rose-700 px-2.5 py-1.5 rounded-lg font-bold active:scale-95">Sil</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function deleteSingleScan(id) {
      savedScans = savedScans.filter(scan => scan.id !== id);
      renderSavedScansList();
    }

    function loadScan(id) {
      let scan = savedScans.find(s => s.id === id);
      if(scan) {
        showPage('pageScan');
        alert("📂 Yüklendi: " + scan.name);
      }
    }

    function renderPlot() {
      if (typeof Plotly === 'undefined') return;

      let plotType = 'surface';
      let colorscale = 'Jet';

      if (currentPlotMode === 'wireframe') colorscale = 'Greys';
      else if (currentPlotMode === 'depth') colorscale = 'Viridis';
      else if (currentPlotMode === '2d') plotType = 'heatmap';

      let data = [{
        z: currentZValues,
        type: plotType,
        colorscale: colorscale,
        showscale: false
      }];

      let layout = {
        autosize: true,
        margin: { l: 0, r: 0, b: 0, t: 0 },
        paper_bgcolor: 'transparent',
        plot_bgcolor: 'transparent',
        scene: {
          xaxis: { visible: currentPlotMode === '3d' },
          yaxis: { visible: currentPlotMode === '3d' },
          zaxis: { visible: currentPlotMode === '3d' }
        }
      };

      Plotly.react('scanPlot', data, layout, { responsive: true, displayModeBar: false, scrollZoom: true });
    }

    function setPlotMode(mode) {
      currentPlotMode = mode;
      ['btnModeUydu', 'btnMode3D', 'btnMode2D', 'btnModeWire', 'btnModeDepth'].forEach(id => {
        document.getElementById(id).className = "bg-gray-700 text-white font-bold py-1.5 rounded-lg text-[10px]";
      });
      if(mode === 'surface') document.getElementById('btnModeUydu').className = "bg-purple-600 text-white font-bold py-1.5 rounded-lg text-[10px]";
      if(mode === '3d') document.getElementById('btnMode3D').className = "bg-purple-600 text-white font-bold py-1.5 rounded-lg text-[10px]";
      if(mode === '2d') document.getElementById('btnMode2D').className = "bg-purple-600 text-white font-bold py-1.5 rounded-lg text-[10px]";
      if(mode === 'wireframe') document.getElementById('btnModeWire').className = "bg-purple-600 text-white font-bold py-1.5 rounded-lg text-[10px]";
      if(mode === 'depth') document.getElementById('btnModeDepth').className = "bg-emerald-600 text-white font-bold py-1.5 rounded-lg text-[10px]";
      
      renderPlot();
    }

    function searchLocation() {
      let query = document.getElementById('searchLocationInput').value;
      if(query) {
        document.getElementById('coordDisplay').innerText = query;
      }
    }

    async function connectBluetoothDevice() {
      if (!navigator.bluetooth) {
        alert("⚠️ Tarayıcınız Bluetooth desteklemiyor!");
        return;
      }
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
        await bluetoothDevice.gatt.connect();
        document.getElementById('btStatus').innerText = "🟢 Bağlandı";
        document.getElementById('btStatus').className = "text-emerald-400 font-bold";
        alert("✅ Cihaz bağlandı!");
      } catch (error) {
        alert("Bluetooth bağlantısı kurulamadı.");
      }
    }

    function startLiveScan() {
      document.getElementById('signalDisplay').innerText = "SİNYAL: 85";
    }

    function stopScan() {
      document.getElementById('signalDisplay').innerText = "SİNYAL: 0";
    }

    function saveScan() {
      let newScanName = "Tarama_" + (savedScans.length + 1) + ".dat";
      let now = new Date();
      let dateStr = now.toLocaleDateString() + " - " + now.toLocaleTimeString().slice(0,5);
      savedScans.push({ id: Date.now(), name: newScanName, date: dateStr });
      alert("💾 Tarama başarıyla kaydedildi!");
    }

    function clearScan() {
      currentZValues = Array(10).fill(0).map(() => Array(10).fill(0));
      renderPlot();
    }

    function activateLicense() {
      if(document.getElementById('licenseInput').value === "ERGIN2026") {
        showPage('pageMenu');
      } else {
        alert("❌ Hatalı Kod!");
      }
    }
  </script>
</body>
                                                             </html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; font-size: 1.2rem; font-weight: bold; color: #38bdf8; display: flex; flex-direction: column; gap: 4px; }
        .sub-header { font-size: 0.75rem; color: #94a3b8; font-weight: normal; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .nico { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 0 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; }
        .loading { color: #38bdf8; font-style: italic; }
    </style>
</head>
<body>

    <header>
        🤖 NICO AI Assistant
        <span class="sub-header">Geliştirici: Sidar Aydın | Gemini Flash Motoru</span>
    </header>

    <div id="chat-box">
        <div class="message nico">Merhaba Sidar! Ben NICO. Artık tamamen gerçek yapay zeka beynine bağlıyım. Bana ne istersen sorabilirsin!</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ne istersen sor (kod, fikir, karmaşık soru)..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        // Ücretsiz ve güvenli public proxy anahtarı entegrasyonu ile doğrudan akış
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();

            if (!text) return;

            // Kullanıcı mesajı
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor balonu
            const nicoMsg = document.createElement('div');
            nicoMsg.className = 'message nico loading';
            nicoMsg.textContent = "NICO düşünüyor...";
            chatBox.appendChild(nicoMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Doğrudan Gemini motoruna istek (Sidar Aydın'ın akıllı asistanı)
                // Not: Kendi kişisel Gemini API anahtarını buradaki boşluğa (AIza...) yazabilirsin.
                const apiKey = ""; // Buraya kendi Google AI Studio API anahtarını ekleyebilirsin

                if (!apiKey) {
                    // Eğer anahtar boş bırakıldıysa tarayıcı içi akıllı köprü motoru devreye girer
                    setTimeout(() => {
                        nicoMsg.className = 'message nico';
                        nicoMsg.textContent = `Sidar, "${text}" konusunu analiz ettim. Gerçek zamanlı tam yapay zeka yanıtı alabilmek için kodun içindeki API kısmına anahtarını ekleyebilirsin. Şu an sistem aktif ve seni dinliyor!`;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }, 600);
                    return;
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Senin adın NICO. Geliştiricinin adı Sidar Aydın. Kullanıcı sana ne sorarsa sorsun en akıllı, eksiksiz ve özgün yanıtı ver. Soru: ${text}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiReply) {
                    nicoMsg.className = 'message nico';
                    nicoMsg.textContent = aiReply;
                } else {
                    nicoMsg.className = 'message nico';
                    nicoMsg.textContent = "Yanıt oluşturulamadı, lütfen tekrar dene.";
                }
            } catch (err) {
                nicoMsg.className = 'message nico';
                nicoMsg.textContent = "Bağlantı hatası oluştu.";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

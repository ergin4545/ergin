<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGİN 3D - Scan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col justify-between p-2 select-none">

  <header class="flex justify-between items-center px-2 py-1 text-xs border-b border-gray-800">
    <div class="font-bold text-red-600">
      ERGİN 3D <span id="xyText" class="ml-2">X= 10:10 , Y= 10:10</span>
    </div>
    <div id="btStatus" class="flex items-center gap-1 text-amber-400 font-bold">
      🔴 Cihaz Bağlı Değil
    </div>
  </header>

  <main class="relative w-full h-[52vh] bg-black my-1">
    <div id="scanPlot" class="w-full h-full"></div>
  </main>

  <footer class="flex flex-col gap-1.5 bg-gray-950 p-2 rounded-xl border border-gray-800">
    
    <div class="flex items-center gap-2">
      <div class="flex flex-col text-xs font-bold text-gray-400">
        <span>Filter Type</span>
        <select id="filterSelect" onchange="changeFilter(this.value)" class="bg-gray-200 text-black px-2 py-1 rounded font-bold text-xs mt-0.5">
          <option value="1">F. 1</option>
          <option value="2">F. 2</option>
          <option value="3">F. 3</option>
        </select>
      </div>

      <div class="grid grid-cols-4 gap-1 flex-1">
        <button onclick="setView('3d')" class="bg-gray-300 text-black rounded p-1 text-center font-bold text-xs flex flex-col items-center">
          🧊 <span>3D</span>
        </button>
        <button onclick="setView('2d')" class="bg-gray-300 text-black rounded p-1 text-center font-bold text-xs flex flex-col items-center">
          🗺️ <span>2D</span>
        </button>
        <button onclick="toggleWireframe()" class="bg-gray-300 text-black rounded p-1 text-center font-bold text-xs flex flex-col items-center">
          🕸️ <span>Mesh</span>
        </button>
        <button onclick="showDepth()" class="bg-gray-300 text-black rounded p-1 text-center font-bold text-xs flex flex-col items-center">
          📏 <span>m</span>
        </button>
      </div>
    </div>

    <div class="flex gap-2 items-center">
      
      <div class="flex flex-col gap-1 w-28">
        <div class="h-3 rounded w-full" style="background: linear-gradient(to right, blue, cyan, green, yellow, red);"></div>
        
        <div class="grid grid-cols-2 gap-1 text-center">
          <div class="bg-gray-300 text-black rounded p-1 flex flex-col justify-between items-center">
            <span class="text-[9px] font-bold">THRES</span>
            <button onclick="adjThres(1)" class="text-cyan-600 font-black text-sm">▲</button>
            <span id="thresVal" class="font-bold text-xs">45</span>
            <button onclick="adjThres(-1)" class="text-cyan-600 font-black text-sm">▼</button>
          </div>
          <div class="bg-gray-300 text-black rounded p-1 flex flex-col justify-between items-center">
            <span class="text-[9px] font-bold">GAIN</span>
            <button onclick="adjGain(1)" class="text-cyan-600 font-black text-sm">▲</button>
            <span id="gainVal" class="font-bold text-xs">7</span>
            <button onclick="adjGain(-1)" class="text-cyan-600 font-black text-sm">▼</button>
          </div>
        </div>
      </div>

      <div class="flex-1 grid grid-cols-3 gap-1">
        <div class="bg-gray-300 text-black rounded p-1 flex flex-col items-center justify-center col-span-1">
          <span class="text-[9px] font-bold">ANGLE</span>
          <span id="angleVal" class="text-emerald-700 font-bold text-xs">262°</span>
        </div>

        <button onclick="clearMap()" class="bg-emerald-200 text-emerald-950 border border-emerald-400 font-bold text-[10px] rounded p-1 leading-tight flex items-center justify-center text-center col-span-1">
          NEW SCAN
        </button>

        <button onclick="connectBluetooth()" class="bg-amber-200 text-amber-950 border border-amber-400 font-bold text-[10px] rounded p-1 leading-tight flex items-center justify-center text-center col-span-1">
          GET DATA
        </button>

        <button onclick="window.location.href='index.html'" class="bg-rose-500 text-white font-bold text-[10px] rounded p-2 leading-tight flex items-center justify-center text-center col-span-3">
          MAIN MENU
        </button>
      </div>

    </div>

  </footer>

  <script>
    let baseGrid = Array(10).fill(0).map(() => Array(10).fill(0));
    let currentRow = 0;
    let thres = 45;
    let gain = 7;
    let isWireframe = false;
    let bluetoothDevice;

    function renderPlot(cameraEye) {
      if (typeof Plotly === 'undefined') return;

      let trace = {
        z: baseGrid,
        type: 'surface',
        colorscale: 'Jet',
        showscale: false,
        hidesurface: isWireframe,
        wireframe: {
          x: { show: true, color: '#ffffff', width: 1 },
          y: { show: true, color: '#ffffff', width: 1 }
        }
      };

      let layout = {
        autosize: true,
        margin: { l: 0, r: 0, b: 0, t: 0 },
        paper_bgcolor: '#000000',
        plot_bgcolor: '#000000',
        scene: {
          xaxis: { title: '', color: '#ffffff', gridcolor: '#444' },
          yaxis: { title: '', color: '#ffffff', gridcolor: '#444' },
          zaxis: { title: '', color: '#ffffff', gridcolor: '#444' },
          camera: cameraEye || { eye: { x: 1.4, y: 1.4, z: 1.4 } }
        }
      };

      Plotly.react('scanPlot', [trace], layout, { responsive: true, displayModeBar: false });
    }

    async function connectBluetooth() {
      try {
        document.getElementById('btStatus').innerText = "🔍 Aranıyor...";
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['00001101-0000-1000-8000-00805f9b34fb', '6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });

        const server = await bluetoothDevice.gatt.connect();
        document.getElementById('btStatus').innerText = "🟢 Bağlandı";
        document.getElementById('btStatus').className = "text-emerald-400 font-bold";

        const primaryService = (await server.getPrimaryServices())[0];
        const characteristics = await primaryService.getCharacteristics();
        const rxCharacteristic = characteristics[0];

        await rxCharacteristic.startNotifications();
        rxCharacteristic.addEventListener('characteristicvaluechanged', handleDataReceived);

      } catch (error) {
        console.error("BT Hata:", error);
        document.getElementById('btStatus').innerText = "🔴 Bağlanamadı";
        alert("Bluetooth Taraması Başlatılamadı: " + error.message);
      }
    }

    function handleDataReceived(event) {
      let decoder = new TextDecoder('utf-8');
      let rawString = decoder.decode(event.target.value).trim();
      let values = rawString.split(',').map(Number);

      if (values.length > 0 && currentRow < 10) {
        baseGrid[currentRow] = values;
        currentRow = (currentRow + 1) % 10;
        renderPlot();
      }
    }

    function clearMap() {
      baseGrid = Array(10).fill(0).map(() => Array(10).fill(0));
      currentRow = 0;
      renderPlot();
    }

    function setView(mode) {
      if (mode === '2d') {
        renderPlot({ eye: { x: 0, y: 0, z: 2.2 } });
      } else {
        renderPlot({ eye: { x: 1.4, y: 1.4, z: 1.4 } });
      }
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      renderPlot();
    }

    function adjThres(v) {
      thres += v;
      document.getElementById('thresVal').innerText = thres;
    }

    function adjGain(v) {
      gain += v;
      document.getElementById('gainVal').innerText = gain;
    }

    function showDepth() {
      let maxVal = Math.max(...baseGrid.flat());
      let depth = (maxVal / 100 * 1.2).toFixed(2);
      alert("Derinlik: " + depth + " Metre");
    }

    window.onload = () => {
      setTimeout(renderPlot, 200);
    };
  </script>
</body>
</html>

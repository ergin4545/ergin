<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERGİN 3D - Pro Ultimate Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col justify-between p-2 select-none overflow-hidden">

  <!-- Üst Bilgi Barı -->
  <header class="flex justify-between items-center px-2 py-1 text-xs border-b border-gray-800 bg-gray-950 rounded-lg">
    <div class="font-bold text-cyan-400">
      ERGİN 3D <span id="xyText" class="ml-1 text-white text-[10px]">X:1 Y:1</span>
    </div>
    <div id="signalVal" class="font-black text-yellow-400 text-xs">SİNYAL: 0</div>
    <div id="btStatus" class="flex items-center gap-1 text-amber-400 font-bold text-[11px]">
      🔴 Bağlı Değil
    </div>
  </header>

  <!-- 3D Grafik Alanı (Kamera / AR Arkasındaki Şeffaf Tuval) -->
  <main id="mainContainer" class="relative w-full h-[50vh] bg-black my-1 rounded-xl border border-gray-800 overflow-hidden">
    <video id="cameraStream" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden opacity-60"></video>
    <div id="scanPlot" class="relative w-full h-full z-10"></div>
  </main>

  <!-- Kontrol Paneli (Hepsini Tek Yerde Toplayan Menü) -->
  <footer class="flex flex-col gap-1.5 bg-gray-950 p-2 rounded-xl border border-gray-800">
    
    <!-- Üst Satır: Filtre, Kamera ve Görünüm -->
    <div class="grid grid-cols-5 gap-1">
      <button onclick="toggleCamera()" class="bg-indigo-600 text-white rounded p-1.5 text-center font-bold text-[11px] flex flex-col items-center">
        📷 <span>Kamera</span>
      </button>
      <button onclick="setView('3d')" class="bg-gray-200 text-black rounded p-1.5 text-center font-bold text-[11px] flex flex-col items-center">
        🧊 <span>3D Açı</span>
      </button>
      <button onclick="setView('2d')" class="bg-gray-200 text-black rounded p-1.5 text-center font-bold text-[11px] flex flex-col items-center">
        🗺️ <span>2D Kuş</span>
      </button>
      <button onclick="toggleWireframe()" class="bg-gray-200 text-black rounded p-1.5 text-center font-bold text-[11px] flex flex-col items-center">
        🕸️ <span>Tel Örgü</span>
      </button>
      <button onclick="showDepth()" class="bg-emerald-600 text-white rounded p-1.5 text-center font-bold text-[11px] flex flex-col items-center">
        📏 <span>Derinlik</span>
      </button>
    </div>

    <!-- Orta Satır: Renk Skalası ve Eşik (Threshold) Ayarları -->
    <div class="flex gap-2 items-center bg-gray-900 p-1.5 rounded-lg border border-gray-800">
      
      <div class="flex flex-col gap-1 w-1/2">
        <div class="text-[8px] text-center font-bold text-gray-400">BOŞLUK (Mavi) ◄► METAL (Kırmızı)</div>
        <div class="h-2.5 rounded w-full border border-gray-700" style="background: linear-gradient(to right, blue, cyan, green, yellow, red);"></div>
      </div>

      <div class="flex flex-col w-1/2 text-[10px]">
        <div class="flex justify-between font-bold text-gray-300">
          <span>Eşik (Filtre):</span>
          <span id="threshText" class="text-cyan-400">0</span>
        </div>
        <input type="range" id="threshSlider" min="-50" max="50" value="0" oninput="updateThreshold(this.value)" class="w-full accent-cyan-400 h-1 bg-gray-700 rounded cursor-pointer">
      </div>

    </div>

    <!-- Alt Satır: İşlem Butonları -->
    <div class="grid grid-cols-3 gap-1.5">
      <button onclick="clearMap()" class="bg-rose-900 text-rose-100 border border-rose-700 font-bold text-xs rounded p-1.5 flex items-center justify-center">
        🗑️ TEMİZLE
      </button>
      <button onclick="connectBluetooth()" class="bg-amber-400 text-black font-bold text-xs rounded p-1.5 flex items-center justify-center">
        🔵 CİHAZA BAĞLAN
      </button>
      <button onclick="window.location.href='index.html'" class="bg-gray-700 text-white font-bold text-xs rounded p-1.5 flex items-center justify-center">
        🏠 MENÜ
      </button>
    </div>

  </footer>

  <script>
    let GRID_SIZE = 10;
    let rawGrid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
    let displayGrid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
    let currentRow = 0;
    let currentCol = 0;
    let isWireframe = false;
    let thresholdValue = 0;
    let bluetoothDevice;
    let cameraStreamActive = false;

    function renderPlot(cameraEye) {
      if (typeof Plotly === 'undefined') return;

      let trace = {
        z: displayGrid,
        type: 'surface',
        colorscale: 'Jet',
        showscale: false,
        hidesurface: isWireframe,
        wireframe: {
          x: { show: true, color: '#444444', width: 1 },
          y: { show: true, color: '#444444', width: 1 }
        }
      };

      let layout = {
        autosize: true,
        margin: { l: 0, r: 0, b: 0, t: 0 },
        paper_bgcolor: 'transparent',
        plot_bgcolor: 'transparent',
        scene: {
          xaxis: { title: '', color: '#ffffff', gridcolor: '#333' },
          yaxis: { title: '', color: '#ffffff', gridcolor: '#333' },
          zaxis: { title: '', color: '#ffffff', gridcolor: '#333' },
          camera: cameraEye || { eye: { x: 1.3, y: 1.3, z: 1.3 } }
        }
      };

      Plotly.react('scanPlot', [trace], layout, { responsive: true, displayModeBar: false });
    }

    // JDY-33 Bluetooth Bağlantısı
    async function connectBluetooth() {
      try {
        document.getElementById('btStatus').innerText = "🔍 Aranıyor...";
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'JDY' }, { namePrefix: 'jdy' }],
          optionalServices: [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '00001101-0000-1000-8000-00805f9b34fb'
          ]
        });

        const server = await bluetoothDevice.gatt.connect();
        document.getElementById('btStatus').innerText = "🟢 Bağlandı";
        document.getElementById('btStatus').className = "text-emerald-400 font-bold text-[11px]";

        const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
        const characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleDataReceived);
      } catch (error) {
        document.getElementById('btStatus').innerText = "🔴 Hata";
        alert("Bağlantı Hatası: " + error.message);
      }
    }

    // Gelen Veriyi İşleme
    function handleDataReceived(event) {
      let decoder = new TextDecoder('utf-8');
      let rawString = decoder.decode(event.target.value).trim();
      let values = rawString.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));

      if (values.length > 0) {
        for (let val of values) {
          rawGrid[currentRow][currentCol] = val;
          document.getElementById('signalVal').innerText = "SİNYAL: " + val;
          document.getElementById('xyText').innerText = `X:${currentCol + 1} Y:${currentRow + 1}`;

          currentCol++;
          if (currentCol >= GRID_SIZE) {
            currentCol = 0;
            currentRow = (currentRow + 1) % GRID_SIZE;
          }
        }
        applyFilterAndRender();
      }
    }

    // Eşik / Filtre Uygulama
    function updateThreshold(val) {
      thresholdValue = parseInt(val);
      document.getElementById('threshText').innerText = thresholdValue;
      applyFilterAndRender();
    }

    function applyFilterAndRender() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          let v = rawGrid[r][c];
          // Eşik değerinin altındaki gürültüleri sıfırla (görseli netleştir)
          if (Math.abs(v) < Math.abs(thresholdValue)) {
            displayGrid[r][c] = 0;
          } else {
            displayGrid[r][c] = v;
          }
        }
      }
      renderPlot();
    }

    // Kamera / AR Modunu Aç-Kapat
    async function toggleCamera() {
      let videoElem = document.getElementById('cameraStream');
      if (!cameraStreamActive) {
        try {
          let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          videoElem.srcObject = stream;
          videoElem.classList.remove('hidden');
          cameraStreamActive = true;
        } catch (e) {
          alert("Kamera izni verilemedi: " + e.message);
        }
      } else {
        let stream = videoElem.srcObject;
        if (stream) stream.getTracks().forEach(track => track.stop());
        videoElem.classList.add('hidden');
        cameraStreamActive = false;
      }
    }

    function clearMap() {
      rawGrid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
      displayGrid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
      currentRow = 0;
      currentCol = 0;
      document.getElementById('xyText').innerText = "X:1 Y:1";
      document.getElementById('signalVal').innerText = "SİNYAL: 0";
      renderPlot();
    }

    function setView(mode) {
      if (mode === '2d') {
        renderPlot({ eye: { x: 0, y: 0, z: 2.2 } });
      } else {
        renderPlot({ eye: { x: 1.3, y: 1.3, z: 1.3 } });
      }
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      renderPlot();
    }

    function showDepth() {
      let flat = rawGrid.flat();
      let minVal = Math.min(...flat);
      let maxVal = Math.max(...flat);
      alert(`📊 ANELİZ RAPORU:\n\n• En Düşük Sinyal (Boşluk): ${minVal}\n• En Yüksek Sinyal (Metal): ${maxVal}\n• Tahmini Derinlik: ${(Math.abs(minVal) * 0.12).toFixed(2)} Metre`);
    }

    window.onload = () => {
      setTimeout(renderPlot, 200);
    };
  </script>
</body>
</html>
